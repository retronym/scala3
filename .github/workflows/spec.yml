name: Specification

on:
  push:
    tags:
      - '*'
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && !contains(github.event.pull_request.body, '[skip ci]'))  ||
        (github.event_name == 'workflow_dispatch' && github.repository == 'scala/scala3') ||
        github.event_name == 'push' ||
        github.event_name == 'merge_group'
    defaults:
      run:
        working-directory: ./docs/_spec

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in sync with ./docs/_spec/Dockerfile
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ./docs/_spec

      - name: Build the specification
        run: |
          bundle exec jekyll build

      - name: Upload the specification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specification
          path: docs/_spec/_site/
          if-no-files-found: error

  # Only main of scala/scala3 publishes the specification. The deploy key is
  # never available to the build, which runs on PRs and other branches.
  deploy:
    runs-on: ubuntu-latest
    needs: specification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'scala/scala3'
    # An older rsync must not finish after a newer one
    concurrency:
      group: spec-deploy
      cancel-in-progress: false

    steps:
      - name: Download the specification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: specification
          path: _site

      - name: Deployment
        uses: burnett01/rsync-deployments@155b6d6c1219ab2224c20c58d423a3f1b850395f # 9.0.1
        with:
          switches: -rzv
          path: _site/
          remote_path: ${{ secrets.SPEC_DEPLOY_PATH }}
          remote_host: ${{ secrets.SPEC_DEPLOY_HOST }}
          remote_user: ${{ secrets.SPEC_DEPLOY_USER }}
          remote_key: ${{ secrets.SPEC_DEPLOY_KEY }}
          remote_key_pass: ${{ secrets.SPEC_DEPLOY_PASS }}
