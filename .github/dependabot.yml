version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Leave time for a compromised release to be caught before we adopt it
    cooldown:
      default-days: 7
    reviewers:
      - scala/infrastructure-maintainers
  - package-ecosystem: bundler
    directory: '/docs/_spec'
    schedule:
      interval: weekly
    # Leave time for a compromised release to be caught before we adopt it
    cooldown:
      default-days: 7
    reviewers:
      - scala/infrastructure-maintainers
